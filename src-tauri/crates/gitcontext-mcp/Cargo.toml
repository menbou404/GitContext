[package]
name = "gitcontext-mcp"
version = "0.1.0-beta.1"
description = "MCP server that exposes GitContext Profiles and repositories to AI agents"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "gitcontext-mcp"
path = "src/main.rs"

[dependencies]
gitcontext-core = { path = "../gitcontext-core" }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros", "schemars", "elicitation"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
